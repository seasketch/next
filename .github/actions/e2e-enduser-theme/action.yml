name: End-user theme
description: Run one end-user Playwright theme. The calling job name is the check name.

inputs:
  theme:
    description: Theme tag without the @
    required: true
  title:
    description: Check name after "End User - "
    required: true
  mapbox-token:
    description: Mapbox token baked into the client build
    required: false
    default: ""
  github-token:
    description: Token for the spatial-uploads image cache
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: ".nvmrc"
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
    - name: Check suite tags
      shell: bash
      run: node packages/e2e/scripts/check-suite-tags.mjs
    - name: Install Playwright browser
      shell: bash
      working-directory: ./packages/e2e
      run: npx playwright install --with-deps chromium
    - name: Build API
      shell: bash
      env:
        REACT_APP_MAPBOX_ACCESS_TOKEN: ${{ inputs.mapbox-token }}
      run: npm run build
    - name: Write the default env
      shell: bash
      run: |
        cp packages/api/.env.template packages/api/.env
        cp packages/client/.env.template packages/client/.env
    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - name: Name this branch's runtime cache
      shell: bash
      run: |
        slug="$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | cut -c1-100)"
        echo "SPATIAL_UPLOADS_CACHE_TAG=cache-$slug" >> "$GITHUB_ENV"
    - name: Build the spatial uploads image
      shell: bash
      run: docker compose --profile data build spatial-uploads
    - name: Run end-user tests
      id: suite
      shell: bash
      env:
        DATABASE_URL: postgres://graphile:password@localhost:54321/seasketch_e2e
        ADMIN_DATABASE_URL: postgres://postgres:password@localhost:54321/seasketch_e2e
        REDIS_PASSWORD: ucsb
        REDIS_DB: "1"
        REACT_APP_MAPBOX_ACCESS_TOKEN: ${{ inputs.mapbox-token }}
        REACT_APP_GRAPHQL_ENDPOINT: http://localhost:13857/graphql
      run: npm run e2e:enduser -- --grep "@${{ inputs.theme }}"
    - name: End-user test report
      uses: dorny/test-reporter@v3
      if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
      with:
        name: End User - ${{ inputs.title }}
        path: packages/e2e/junit.xml
        reporter: java-junit
        fail-on-error: false
    - name: Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
      with:
        name: playwright-report-enduser-${{ inputs.theme }}
        if-no-files-found: warn
        path: |
          packages/e2e/playwright-report/
          packages/e2e/test-results/
          .logs/
        retention-days: 14
    - name: Playwright report location
      if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
      shell: bash
      run: |
        {
          echo "### Playwright report"
          echo "The **playwright-report-enduser-${{ inputs.theme }}** artifact on this run has the HTML report, and screenshots, video, and traces for any failure."
          echo "Download it and open the report with \`npx playwright show-report playwright-report\`."
        } >> "$GITHUB_STEP_SUMMARY"
