name: Integration tests
# End-user and admin Playwright suites. Create Deployment does not wait on
# this workflow, and these jobs are not a deploy gate.
#
# Runs on every branch push, the same trigger as Unit Tests, and when someone
# starts this workflow by hand. Smoke stays the short job in unit-tests.yml.
on: [push, workflow_dispatch]

permissions:
  contents: read
  checks: write
  actions: read
  # The suites import the BuildKit cache at
  # ghcr.io/seasketch/spatial-uploads-runtime.
  packages: read

jobs:
  integration:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Normally well under an hour. A push that changes the native-tool stages
    # of the spatial uploads Dockerfile misses the registry cache and builds
    # GDAL here, which is 30 minutes or more on its own.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: End-user integration
            script: e2e:enduser
            report: End-user Test Output
            artifact: playwright-report-enduser
          - name: Admin integration
            script: e2e:admin
            report: Admin Test Output
            artifact: playwright-report-admin
    env:
      DATABASE_URL: postgres://graphile:password@localhost:54321/seasketch_e2e
      ADMIN_DATABASE_URL: postgres://postgres:password@localhost:54321/seasketch_e2e
      # Matches the password in compose.yaml.
      REDIS_PASSWORD: ucsb
      REDIS_DB: "1"
      REACT_APP_MAPBOX_ACCESS_TOKEN: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
      REACT_APP_GRAPHQL_ENDPOINT: http://localhost:13857/graphql
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check suite tags
        run: node packages/e2e/scripts/check-suite-tags.mjs
      - name: Install Playwright browser
        working-directory: ./packages/e2e
        run: npx playwright install --with-deps chromium
      - name: Build API
        run: npm run build
      - name: Write the default env
        run: |
          cp packages/api/.env.template packages/api/.env
          cp packages/client/.env.template packages/client/.env
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name this branch's runtime cache
        run: |
          slug="$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | cut -c1-100)"
          echo "SPATIAL_UPLOADS_CACHE_TAG=cache-$slug" >> "$GITHUB_ENV"
      - name: Build the spatial uploads image
        run: docker compose --profile data build spatial-uploads
      - name: Run ${{ matrix.name }}
        id: suite
        env:
          SUITE_SCRIPT: ${{ matrix.script }}
        run: npm run "$SUITE_SCRIPT"
      - name: Integration test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        with:
          name: ${{ matrix.report }}
          path: packages/e2e/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
            .logs/
          retention-days: 14
      - name: Playwright report location
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: |
          {
            echo "### Playwright report"
            echo "The **${{ matrix.artifact }}** artifact on this run has the HTML report, and screenshots, video, and traces for any failure."
            echo "Download it and open the report with \`npx playwright show-report playwright-report\`."
          } >> "$GITHUB_STEP_SUMMARY"
