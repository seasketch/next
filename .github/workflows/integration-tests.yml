name: Integration Tests
on: [push]

# End-user and admin Playwright. Smoke stays in unit-tests.yml.
# Create Deployment does not wait on this workflow.
# One job per end-user theme, written out so the check list shows
# "End User - Access" and the rest. A matrix collapses those cells.
# A new theme is a job here. check-suite-tags.mjs fails until it exists.

permissions:
  contents: read
  checks: write
  actions: read
  # These jobs import the BuildKit cache at
  # ghcr.io/seasketch/spatial-uploads-runtime.
  packages: read

jobs:
  e2e-enduser-access:
    name: End User - Access
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-enduser-theme
        with:
          theme: access
          title: Access
          mapbox-token: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  e2e-enduser-basemaps:
    name: End User - Basemaps
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-enduser-theme
        with:
          theme: basemaps
          title: Basemaps
          mapbox-token: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  e2e-enduser-forums:
    name: End User - Forums
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-enduser-theme
        with:
          theme: forums
          title: Forums
          mapbox-token: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  e2e-enduser-homepage:
    name: End User - Homepage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-enduser-theme
        with:
          theme: homepage
          title: Homepage
          mapbox-token: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  e2e-enduser-language:
    name: End User - Language
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-enduser-theme
        with:
          theme: language
          title: Language
          mapbox-token: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  e2e-enduser-map:
    name: End User - Map
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-enduser-theme
        with:
          theme: map
          title: Map
          mapbox-token: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  e2e-enduser-overlays:
    name: End User - Overlays
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-enduser-theme
        with:
          theme: overlays
          title: Overlays
          mapbox-token: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  e2e-enduser-reports:
    name: End User - Reports
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-enduser-theme
        with:
          theme: reports
          title: Reports
          mapbox-token: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  e2e-enduser-session:
    name: End User - Session
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-enduser-theme
        with:
          theme: session
          title: Session
          mapbox-token: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
  e2e-enduser-surveys:
    name: End User - Surveys
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-enduser-theme
        with:
          theme: surveys
          title: Surveys
          mapbox-token: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  e2e-admin:
    name: Admin integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgres://graphile:password@localhost:54321/seasketch_e2e
      ADMIN_DATABASE_URL: postgres://postgres:password@localhost:54321/seasketch_e2e
      # Matches the password in compose.yaml.
      REDIS_PASSWORD: ucsb
      REDIS_DB: "1"
      REACT_APP_MAPBOX_ACCESS_TOKEN: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
      REACT_APP_GRAPHQL_ENDPOINT: http://localhost:13857/graphql
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check suite tags
        run: node packages/e2e/scripts/check-suite-tags.mjs
      - name: Install Playwright browser
        working-directory: ./packages/e2e
        run: npx playwright install --with-deps chromium
      - name: Build API
        run: npm run build
      - name: Write the default env
        run: |
          cp packages/api/.env.template packages/api/.env
          cp packages/client/.env.template packages/client/.env
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name this branch's runtime cache
        run: |
          slug="$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | cut -c1-100)"
          echo "SPATIAL_UPLOADS_CACHE_TAG=cache-$slug" >> "$GITHUB_ENV"
      - name: Build the spatial uploads image
        run: docker compose --profile data build spatial-uploads
      - name: Run admin tests
        id: suite
        run: npm run e2e:admin
      - name: Admin test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        with:
          name: Admin Test Output
          path: packages/e2e/junit.xml
          reporter: java-junit
          fail-on-error: false
      - name: Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        with:
          name: playwright-report-admin
          if-no-files-found: warn
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
            .logs/
          retention-days: 14
      - name: Playwright report location
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: |
          {
            echo "### Playwright report"
            echo "The **playwright-report-admin** artifact on this run has the HTML report, and screenshots, video, and traces for any failure."
            echo "Download it and open the report with \`npx playwright show-report playwright-report\`."
          } >> "$GITHUB_STEP_SUMMARY"
