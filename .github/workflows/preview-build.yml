name: Preview Client Build
on: [push]
jobs:
  deploy_client:
    name: Deploy Client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview_client
      url: ${{ steps.wrangler.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install dependencies
        run: npx lerna@6.6.2 bootstrap --ci --scope=client --include-dependencies
      - name: Build client
        working-directory: ./packages/client
        env:
          SKIP_PREFLIGHT_CHECK: true
          REACT_APP_AUTH0_CLIENT_ID: ${{ secrets.REACT_APP_AUTH0_CLIENT_ID }}
          REACT_APP_AUTH0_DOMAIN: ${{ secrets.REACT_APP_AUTH0_DOMAIN }}
          REACT_APP_AUTH0_SCOPE: "openid profile email permissions"
          REACT_APP_AUTH0_AUDIENCE: https://api.seasketch.org
          REACT_APP_MAPBOX_ACCESS_TOKEN: ${{ secrets.REACT_APP_MAPBOX_ACCESS_TOKEN }}
          REACT_APP_GRAPHQL_ENDPOINT: ${{ secrets.REACT_APP_GRAPHQL_ENDPOINT }}
          REACT_APP_BUILD: ${{ github.sha }}
          REACT_APP_SENTRY_DSN: ${{ secrets.REACT_APP_SENTRY_DSN }}
          REACT_APP_CLOUDFRONT_DOCS_DISTRO: ${{ secrets.REACT_APP_CLOUDFRONT_DOCS_DISTRO }}
          REACT_APP_CLOUDFLARE_IMAGES_ENDPOINT: ${{ secrets.REACT_APP_CLOUDFLARE_IMAGES_ENDPOINT }}
        run: CI=false npm run build
      - name: upload cloudflare workers version preview
        id: wrangler
        working-directory: ./packages/client
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{secrets.CLOUDFLARE_ACCOUNT_ID}}
          CLOUDFLARE_API_TOKEN: ${{secrets.CLOUDFLARE_API_TOKEN}}
        run: |
          set -euo pipefail
          OUTPUT=$(npx wrangler@4 versions upload 2>&1 | tee /dev/stderr)
          # Prefer an explicit Version Preview URL; fall back to any workers.dev URL.
          URL=$(echo "$OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' | head -1 || true)
          if [[ -z "$URL" ]]; then
            echo "Could not parse Workers version preview URL from wrangler output" 1>&2
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
