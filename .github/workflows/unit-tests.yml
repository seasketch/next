name: Unit Tests
on: [push]

permissions:
  contents: read
  checks: write
  actions: read

jobs:
  test-server:
    name: Test GraphQL API Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: underbluewaters/postgres-13-postgis-3.1:latest
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: password
      redis:
        image: "redis:alpine"
        ports:
          - "6379:6379"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install dependencies
        run: npx lerna@6.6.2 bootstrap --ci
      - name: Build API
        working-directory: ./packages/api
        run: npm run build
      - name: Init docker db
        working-directory: ./packages/api
        env:
          TEST_DB: postgres://postgres:password@localhost:5432/
        run: node tests/init_dockerdb.js
      - name: Run Tests
        working-directory: ./packages/api
        run: npx jest --ci --reporters=default --reporters=jest-junit
        env:
          TEST_DB: postgres://postgres:password@localhost:5432/
          SES_EMAIL_SOURCE: do-not-reply@seasketch.org
      - name: API Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: API Test Output
          path: packages/api/junit.xml
          reporter: jest-junit
          fail-on-error: false

  database-drift:
    name: Check for schema and generated code drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: underbluewaters/postgres-13-postgis-3.1:latest
        ports:
          - "54321:5432"
        env:
          POSTGRES_PASSWORD: password
      redis:
        image: "redis:alpine"
        ports:
          - "6379:6379"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install dependencies
        run: npx lerna@6.6.2 bootstrap --ci
      - name: Build API
        working-directory: ./packages/api
        run: npm run build
      - name: Initialize database
        working-directory: ./packages/api
        env:
          TEST_DB: postgres://postgres:password@localhost:54321/
          DATABASE_URL: postgres://postgres:password@localhost:54321/seasketch
          ADMIN_DATABASE_URL: postgres://postgres:password@localhost:54321/seasketch
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          GM_DBURL: postgres://postgres:password@localhost:54321/seasketch_shadow
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          node tests/init_dockerdb.js
          IN_TESTS=1 npm run db:migrate -- --shadow
          node dist/src/createCleanGraphqlSchema.js
      - name: Check for graphql schema drift
        working-directory: ./packages/api
        run: |
          ls -lh generated-schema*
          npm run db:drift
      - name: Check for drift in hooks
        working-directory: ./packages/client
        run: |
          npx graphql-codegen --config codegen.yml
          git diff --exit-code ./src/generated/graphql.ts

  test-client:
    name: Test React Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install dependencies
        run: npx lerna@6.6.2 bootstrap --ci
      - name: Test client
        working-directory: ./packages/client
        env:
          SKIP_PREFLIGHT_CHECK: true
          REACT_APP_GRAPHQL_ENDPOINT: http://localhost:3857/graphql
        run: npm run test -- --ci --testResultsProcessor="jest-junit" --watchAll=false
      - name: React Client Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: React Client Test Output
          path: packages/client/junit.xml
          reporter: jest-junit
          fail-on-error: false

  test-overlay-engine:
    name: Test Overlay Engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install dependencies
        run: npx lerna@6.6.2 bootstrap --ci --scope=overlay-engine --include-dependencies
      - name: Run tests
        working-directory: ./packages/overlay-engine
        run: npx vitest run --reporter=default --reporter=junit --outputFile=junit.xml
      - name: Overlay Engine Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Overlay Engine Test Output
          path: packages/overlay-engine/junit.xml
          reporter: jest-junit
          fail-on-error: false

  build-client:
    name: Build React Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - id: short_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npx lerna@6.6.2 bootstrap --ci
      - name: Build client
        working-directory: ./packages/client
        env:
          SKIP_PREFLIGHT_CHECK: true
          REACT_APP_AUTH0_CLIENT_ID: ${{ secrets.REACT_APP_AUTH0_CLIENT_ID }}
          REACT_APP_AUTH0_DOMAIN: ${{ secrets.REACT_APP_AUTH0_DOMAIN }}
          REACT_APP_AUTH0_SCOPE: ${{ secrets.REACT_APP_AUTH0_SCOPE }}
          REACT_APP_AUTH0_AUDIENCE: ${{ secrets.REACT_APP_AUTH0_AUDIENCE }}
          REACT_APP_MAPBOX_ACCESS_TOKEN: abc123
          REACT_APP_GRAPHQL_ENDPOINT: https://example.com/graphql
          REACT_APP_BUILD: ${{ steps.short_sha.outputs.sha }}
        run: NODE_OPTIONS=--openssl-legacy-provider CI=false npm run build
