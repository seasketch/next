name: seasketch

# One bridge network for every project that loads this file. The e2e profile
# runs as project seasketch-e2e beside a developer's containers, and its
# handler containers reach Postgres and Redis through host.docker.internal
# and the published ports. On Linux that route works only from the same
# bridge network as the target; traffic between two bridge networks is
# dropped by Docker's isolation rules.
networks:
  default:
    name: seasketch

services:
  db:
    container_name: "seasketch_db"
    image: underbluewaters/postgres-13-postgis-3.1
    ports:
      - "54321:5432"
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - ./packages/api/init_dockerdb.sql:/docker-entrypoint-initdb.d/init_dockerdb.sql
    # Avoid log_statement=all: graphile_worker polls constantly and will fill
    # Docker's disk with container JSON logs (previously grew to ~232GB).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      # TCP only (-h 127.0.0.1). The image's entrypoint runs a temporary
      # unix-socket-only server for init scripts, then restarts; a socket
      # probe would pass too early. Also require the graphile role from
      # init_dockerdb.sql.
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d postgres && PGPASSWORD=password psql -h 127.0.0.1 -U postgres -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'graphile'" | grep -q 1
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
  redis:
    image: "redis:alpine"
    command: >
      --requirepass ucsb
    ports:
      - "6379:6379"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ucsb", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Data-path containers. `npm run dev` starts them (profile `data`, the
  # default) and restarts each one when its sources change. `--ci` starts them
  # once and waits for the healthchecks. `--profile core` leaves them out.
  #
  # The values below are the local defaults from packages/local-r2 and
  # scripts/dev.config.mjs. The ${VAR:-default} forms are what the e2e profile
  # overrides so its containers run beside a developer's own.
  # See design-docs/dev-environment/local-data-services.md.

  # SQS stand-in for the overlay engine results queue. Queues are declared in
  # elasticmq.conf. Messages do not survive a restart; Postgres is the state of
  # record for the jobs they describe.
  elasticmq:
    profiles: ["data"]
    image: softwaremill/elasticmq-native:1.6.12
    ports:
      - "${ELASTICMQ_PORT:-9324}:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:9324/?Action=ListQueues' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The spatial uploads handler, as the production image under the Lambda
  # runtime emulator. The API posts the same event Lambda would receive to
  # http://localhost:9001/2015-03-31/functions/function/invocations.
  # `develop.watch` copies a rebuilt dist/ in and restarts the container; the
  # host `spatial-uploads-tsc` entry in scripts/dev.config.mjs does the rebuild.
  spatial-uploads:
    profiles: ["data"]
    build:
      context: .
      dockerfile: packages/spatial-uploads-handler/Dockerfile
    image: seasketch-spatial-uploads:dev
    platform: linux/amd64
    ports:
      - "${SPATIAL_UPLOADS_PORT:-9001}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: development
      # Object storage: the local S3 API served by packages/local-r2.
      R2_ENDPOINT: http://host.docker.internal:${LOCAL_R2_PORT:-8333}/cdn-cgi/local/r2/s3
      R2_ACCESS_KEY_ID: local
      R2_SECRET_ACCESS_KEY: local-r2-secret
      BUCKET: ssn-spatial-uploads-tmp-local
      SPATIAL_UPLOADS_BUCKET: ssn-spatial-uploads-tmp-local
      R2_TILES_BUCKET: ssn-tiles-local
      RESOURCES_REMOTE: r2://ssn-tiles-local
      TILES_REMOTE: r2://ssn-tiles-local
      # Public origins written into the rows this handler creates. These are
      # the two pmtiles-server sessions, as the browser reaches them.
      UPLOADS_BASE_URL: http://localhost:${PMTILES_UPLOADS_PORT:-8788}
      TILES_BASE_URL: http://localhost:${PMTILES_TILES_PORT:-8787}
      # Progress updates go straight to Postgres. A localhost-style host
      # selects password auth instead of the RDS IAM signer.
      PGHOST: host.docker.internal
      PGPORT: "54321"
      PGUSER: postgres
      PGPASSWORD: password
      PGDATABASE: ${SEASKETCH_DB_NAME:-seasketch}
      PGREGION: us-west-2
      AWS_REGION: us-west-2
    healthcheck:
      # Any HTTP answer means the emulator is up. Do not POST to the invoke
      # path here; that would run the handler with an empty event.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s
    develop:
      watch:
        - action: sync+restart
          path: ./packages/spatial-uploads-handler/dist
          target: /var/task/packages/spatial-uploads-handler/dist

  # Subdivision worker, the production image under the Lambda emulator.
  subdivision:
    profiles: ["data"]
    build:
      context: ./packages/subdivision-worker
    image: seasketch-subdivision:dev
    ports:
      - "${SUBDIVISION_PORT:-9000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      R2_ENDPOINT: http://host.docker.internal:${LOCAL_R2_PORT:-8333}/cdn-cgi/local/r2/s3
      R2_ACCESS_KEY_ID: local
      R2_SECRET_ACCESS_KEY: local-r2-secret
      R2_BUCKET: ssn-tiles-local
      UPLOADS_BASE_URL: http://localhost:${PMTILES_UPLOADS_PORT:-8788}
      # Progress messages go to elasticmq. The queue URL in each event names
      # the queue; this says where to send the request. Through the host
      # gateway, like storage, so every hop out of a container looks the same.
      SQS_ENDPOINT: http://host.docker.internal:${ELASTICMQ_PORT:-9324}
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      # Source URLs name the host's localhost. Inside the container that is
      # host.docker.internal. Pairs of public=reachable origins.
      STORAGE_ORIGIN_MAP: http://localhost:${PMTILES_UPLOADS_PORT:-8788}=http://host.docker.internal:${PMTILES_UPLOADS_PORT:-8788},http://localhost:${PMTILES_TILES_PORT:-8787}=http://host.docker.internal:${PMTILES_TILES_PORT:-8787}
      # Unset: the local pmtiles-server runs with access control off, so the
      # worker sends no Authorization header. Production sets the ARN.
      OVERLAY_ENGINE_ACCESS_TOKEN_SECRET_ARN: ""
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s=socket.create_connection(('127.0.0.1',8080),2); s.close()"
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    develop:
      watch:
        - action: sync+restart
          path: ./packages/subdivision-worker
          target: /var/task
          ignore:
            - README.md
            - Dockerfile
            - requirements.txt
