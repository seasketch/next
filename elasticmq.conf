// Queues for the local SQS stand-in (compose.yaml `elasticmq`).
// Queue URLs take the form http://<host>:9324/000000000000/<name>. The host is
// whatever the caller connected to, so the API on the host and a container
// on the compose network can both address the same queue.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = false
}

// The API long-polls with WaitTimeSeconds=20. The HTTP server's own request
// timeout has to outlast that, or every empty poll ends in a 503 text body
// that the AWS SDK reports as a JSON parse error.
pekko.http.server {
  request-timeout = 30 seconds
  idle-timeout = 90 seconds
}

queues {
  // Progress and completion messages from the subdivision and overlay
  // workers, consumed by the API (OVERLAY_ENGINE_WORKER_SQS_QUEUE_URL).
  overlay-engine-results {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}
