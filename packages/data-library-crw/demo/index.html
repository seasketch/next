<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Coral Reef Watch</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.29.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="hover"></div>
    <div class="topbar">
      <div>
        <h1 id="title">Coral Reef Watch</h1>
        <p id="source-label">Loading…</p>
      </div>
      <div class="controls">
        <label style="font-size: 13px; color: var(--muted)">
          Product
          <select id="product" style="margin-left: 8px"></select>
        </label>
        <label style="font-size: 13px; color: var(--muted)">
          Source
          <select id="source" style="margin-left: 8px">
            <option value="local">Local archive</option>
            <option value="remote">tiles.seasketch.org</option>
          </select>
        </label>
        <label style="font-size: 13px; color: var(--muted)">
          Jump
          <select id="place" style="margin-left: 8px">
            <option value="155,0,2">Globe</option>
            <option value="-81.3,24.8,7">Florida / Caribbean</option>
            <option value="146.8,-18.2,6">Great Barrier Reef</option>
            <option value="-157.8,21.3,7">Hawaiʻi</option>
            <option value="177.96,-17.40,7">Fiji</option>
            <option value="39.3,-6.2,6">East Africa</option>
            <option value="120.3,14.6,6">Philippines</option>
          </select>
        </label>
      </div>
    </div>
    <div class="legend">
      <div id="legend-title">DHW (°C-weeks)</div>
      <div id="legend-body"></div>
      <div class="meta" id="stats">Loading archive…</div>
    </div>
    <div class="zoom-pill" id="zoom-pill">z —</div>
    <div class="slider">
      <div class="slider-row">
        <button class="icon" id="play" type="button">▶</button>
        <select id="speed" title="Playback speed">
          <option value="1">1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
        </select>
        <div class="year" id="year">—</div>
        <input id="band" type="range" min="0" max="1" value="0" />
      </div>
      <div class="ticks" id="ticks"></div>
      <div class="meta">Playback only changes <code>raster-array-band</code>.</div>
    </div>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.29.0/mapbox-gl.js"></script>
    <script src="/config.js"></script>
    <script type="module">
      import {
        createMap,
        loadTileset,
        paintForProduct,
        legendForProduct,
        formatHover,
        bindSlider,
        addRasterArrayLayer,
        showError,
      } from "./app.js";

      const params = new URLSearchParams(location.search);
      const products = window.CRW?.products ?? [
        { id: "dhw-max", title: "Degree Heating Week (annual max)" },
      ];
      const localProducts = new Set(window.CRW?.localProducts ?? []);
      const initialProduct = products.some((p) => p.id === params.get("product"))
        ? params.get("product")
        : products[0].id;
      const initialSource =
        params.get("src") === "remote"
          ? "remote"
          : localProducts.has(initialProduct)
            ? "local"
            : "remote";

      const productSelect = document.getElementById("product");
      for (const product of products) {
        const option = document.createElement("option");
        option.value = product.id;
        option.textContent = product.shortTitle || product.title;
        productSelect.appendChild(option);
      }
      productSelect.value = initialProduct;
      document.getElementById("source").value = initialSource;

      function renderLegend(productId) {
        const spec = legendForProduct(productId);
        document.getElementById("legend-title").textContent = spec.title;
        const body = document.getElementById("legend-body");
        body.replaceChildren();
        if (spec.ramp) {
          const ramp = document.createElement("div");
          ramp.className = "ramp";
          ramp.style.background = spec.ramp;
          body.appendChild(ramp);
          const ticks = document.createElement("div");
          ticks.className = "ticks";
          ticks.style.margin = "0";
          for (const label of spec.labels) {
            const span = document.createElement("span");
            span.textContent = label;
            ticks.appendChild(span);
          }
          body.appendChild(ticks);
        }
        if (spec.swatches) {
          for (const [color, label] of spec.swatches) {
            const row = document.createElement("div");
            row.className = "swatch";
            row.innerHTML = `<i style="background:${color}"></i>${label}`;
            body.appendChild(row);
          }
        }
      }

      try {
        const map = await createMap([155, 0], 2);
        let layer = null;
        let currentProduct = initialProduct;
        // Raster tile zoom = floor(map zoom + log2(512 / tileSize)), clamped to
        // the source's zoom range — for our 256px tiles that is map zoom + 1.
        let tileZoomParams = { tileSize: 256, minzoom: 0, maxzoom: 5 };

        function updateZoomPill() {
          const zoom = map.getZoom();
          const { tileSize, minzoom, maxzoom } = tileZoomParams;
          const ideal = Math.floor(zoom + Math.log2(512 / tileSize));
          const tileZ = Math.min(maxzoom, Math.max(minzoom, ideal));
          document.getElementById("zoom-pill").textContent =
            `z ${zoom.toFixed(2)} · tiles z${tileZ}`;
        }
        map.on("zoom", updateZoomPill);

        async function show(source, productId) {
          currentProduct = productId;
          const meta = products.find((p) => p.id === productId);
          const tj = await loadTileset(source, productId);
          layer = tj.raster_layers[0];
          const bands = layer.fields.bands;
          await addRasterArrayLayer(map, {
            sourceId: "raster-src",
            layerId: "raster-layer",
            tilejson: tj,
            paint: paintForProduct(productId, bands[bands.length - 1]),
          });
          bindSlider({
            bands,
            playMs:
              meta?.cadence === "day" ? 160 : meta?.cadence === "week" ? 200 : 280,
            onBand: (band) => {
              if (map.getLayer("raster-layer")) {
                map.setPaintProperty("raster-layer", "raster-array-band", band);
              }
            },
          });
          document.getElementById("title").textContent =
            meta?.title || "Coral Reef Watch";
          document.getElementById("source-label").textContent =
            source === "remote"
              ? `https://tiles.seasketch.org/dataLibrary/crw-${productId}-v1`
              : `Local crw-${productId}-v1.pmtiles`;
          renderLegend(productId);
          const el = document.getElementById("stats");
          const unit =
            meta?.cadence === "day"
              ? "days"
              : meta?.cadence === "week"
                ? "weeks"
                : "years";
          const parts = [`${bands.length} ${unit}`, `z${tj.minzoom}–${tj.maxzoom}`];
          tileZoomParams = {
            tileSize: layer.fields.tilesize || 256,
            minzoom: tj.minzoom,
            maxzoom: tj.maxzoom,
          };
          updateZoomPill();
          if (source === "local" && typeof tj._bytes === "number" && tj._bytes > 0) {
            parts.push(`${(tj._bytes / 1e6).toFixed(0)} MB`);
          }
          el.textContent = parts.join(" · ");
        }

        await show(initialSource, initialProduct);

        function persist(source, productId) {
          const url = new URL(location.href);
          url.searchParams.set("src", source);
          url.searchParams.set("product", productId);
          history.replaceState(null, "", url);
        }

        document.getElementById("source").addEventListener("change", async (e) => {
          const source = e.target.value;
          persist(source, currentProduct);
          try {
            await show(source, currentProduct);
          } catch (err) {
            showError(err);
          }
        });

        productSelect.addEventListener("change", async (e) => {
          const productId = e.target.value;
          const source = document.getElementById("source").value;
          persist(source, productId);
          try {
            await show(source, productId);
          } catch (err) {
            showError(err);
          }
        });

        document.getElementById("place").addEventListener("change", (e) => {
          const [lon, lat, zoom] = e.target.value.split(",").map(Number);
          map.jumpTo({ center: [lon, lat], zoom });
        });

        map.on("mousemove", async (e) => {
          const hover = document.getElementById("hover");
          if (!layer) return;
          try {
            const band = map.getPaintProperty("raster-layer", "raster-array-band");
            const result = await map.queryRasterValue("raster-src", e.lngLat, {
              layerName: layer.id,
              bands: [band],
            });
            const value = result?.[layer.id]?.[band]?.[0];
            const text = formatHover(currentProduct, band, value);
            if (text == null) {
              hover.style.display = "none";
              return;
            }
            hover.style.display = "block";
            hover.style.left = e.point.x + "px";
            hover.style.top = e.point.y + "px";
            hover.textContent = text;
          } catch {
            hover.style.display = "none";
          }
        });
      } catch (err) {
        showError(err);
      }
    </script>
  </body>
</html>
