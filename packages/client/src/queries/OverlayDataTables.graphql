# Lean, public-safe subset of OverlayDataTable fields for the map legend /
# table of contents (ActivatedDataTableButton). Deliberately omits internal
# remote paths that only make sense to admins.
fragment ClientOverlayDataTable on OverlayDataTable {
  id
  stableId
  name
  description
  version
  rowCount
  joinColumn
  overlayJoinColumn
  queryUrl
  columnStatsUrl
  visualizationColumns
  visualizationOps
  calculationMode
  additionalReplicateIdentifiers
  replicateLabel
  replicateLabelCustom
  withinReplicateOperations
  acrossReplicateOperations
  subjectColumn
  observationDetailColumns
  coverageMode
  effortMarkerValues
  excludedValues
  requiredFilterColumns
  hiddenFilterColumns
  filterColumnLabels
  temporal
  organism
}

fragment OverlayDataTableDetails on OverlayDataTable {
  id
  stableId
  name
  description
  version
  joinColumn
  overlayJoinColumn
  rowCount
  parquetRemote
  columnStatsRemote
  parquetUrl
  columnStatsUrl
  queryUrl
  deletedAt
  replacedById
  createdAt
  updatedAt
  visualizationColumns
  visualizationOps
  calculationMode
  additionalReplicateIdentifiers
  replicateLabel
  replicateLabelCustom
  withinReplicateOperations
  acrossReplicateOperations
  subjectColumn
  observationDetailColumns
  coverageMode
  coverageRemote
  effortMarkerValues
  excludedValues
  requiredFilterColumns
  hiddenFilterColumns
  filterColumnLabels
  temporal
  organism
  nodataValues
  organismCatalogUrl
  organismPreviewUrl
}

query OverlayDataTableVisualizationMetadata($id: Int!) {
  overlayDataTable(id: $id) {
    id
    queryUrl
    columnStatsUrl
    visualizationColumns
    visualizationOps
    calculationMode
    additionalReplicateIdentifiers
    replicateLabel
    replicateLabelCustom
    withinReplicateOperations
    acrossReplicateOperations
    subjectColumn
    observationDetailColumns
    coverageMode
    effortMarkerValues
    excludedValues
    requiredFilterColumns
    hiddenFilterColumns
    filterColumnLabels
  }
}

query OverlayDataTableVisualizationMetadataForLayer($tocItemId: Int!) {
  tableOfContentsItem(id: $tocItemId) {
    id
    overlayDataTables {
      id
      queryUrl
      columnStatsUrl
      visualizationColumns
      visualizationOps
      calculationMode
      additionalReplicateIdentifiers
      replicateLabel
      replicateLabelCustom
      withinReplicateOperations
      acrossReplicateOperations
      subjectColumn
      observationDetailColumns
      coverageMode
      effortMarkerValues
      excludedValues
      requiredFilterColumns
      hiddenFilterColumns
      filterColumnLabels
    }
  }
}

fragment OverlayDataTableUploadDetails on OverlayDataTableUpload {
  id
  tableOfContentsItemId
  filename
  contentType
  processingOptions
  overlayJoinColumn
  errorDetails
  presignedUploadUrl
  replaceOverlayDataTableId
  reprocessOfOverlayDataTableId
  projectBackgroundJobId
}

mutation CreateOverlayDataTableUpload(
  $tableOfContentsItemId: Int!
  $filename: String!
  $contentType: String!
  $processingOptions: JSON
  $replaceOverlayDataTableId: Int
) {
  createOverlayDataTableUpload(
    input: {
      tocItemId: $tableOfContentsItemId
      filename: $filename
      contentType: $contentType
      processingOptions: $processingOptions
      replaceOverlayDataTableId: $replaceOverlayDataTableId
    }
  ) {
    overlayDataTableUpload {
      ...OverlayDataTableUploadDetails
    }
    projectBackgroundJob {
      ...JobDetails
    }
  }
}

mutation SubmitOverlayDataTableUpload($jobId: UUID!) {
  submitOverlayDataTableUpload(input: { jobId: $jobId }) {
    projectBackgroundJob {
      id
      state
      progress
      progressMessage
    }
  }
}

mutation UpdateOverlayDataTableDetails($id: Int!, $name: String!, $description: String) {
  updateOverlayDataTableDetails(
    input: { tableId: $id, name: $name, description: $description }
  ) {
    overlayDataTable {
      ...OverlayDataTableDetails
    }
  }
}

mutation RenameOverlayDataTable($id: Int!, $name: String!) {
  renameOverlayDataTable(input: { tableId: $id, newName: $name }) {
    overlayDataTable {
      ...OverlayDataTableDetails
    }
  }
}

mutation SoftDeleteOverlayDataTable($id: Int!) {
  softDeleteOverlayDataTable(input: { tableId: $id }) {
    overlayDataTable {
      id
      deletedAt
    }
  }
}

mutation RollbackOverlayDataTableVersion($id: Int!) {
  rollbackOverlayDataTableVersion(input: { tableId: $id }) {
    overlayDataTable {
      ...OverlayDataTableDetails
    }
  }
}

mutation SetOverlayDataTableVisualizationSettings(
  $id: Int!
  $visualizationColumns: [String]!
  $visualizationOps: [String]!
  $requiredFilterColumns: [String]!
  $hiddenFilterColumns: [String]!
  $filterColumnLabels: JSON!
  $calculationMode: String
  $additionalReplicateIdentifiers: [String]
  $replicateLabel: String
  $replicateLabelCustom: String
  $withinReplicateOperations: JSON
  $acrossReplicateOperations: JSON
  $subjectColumn: String
  $observationDetailColumns: [String]
  $coverageMode: String
  $effortMarkerValues: [String]
  $excludedValues: JSON
) {
  setOverlayDataTableVisualizationSettings(
    input: {
      tableId: $id
      visualizationColumns: $visualizationColumns
      visualizationOps: $visualizationOps
      requiredFilterColumns: $requiredFilterColumns
      hiddenFilterColumns: $hiddenFilterColumns
      filterColumnLabels: $filterColumnLabels
      calculationMode: $calculationMode
      additionalReplicateIdentifiers: $additionalReplicateIdentifiers
      replicateLabel: $replicateLabel
      replicateLabelCustom: $replicateLabelCustom
      withinReplicateOperations: $withinReplicateOperations
      acrossReplicateOperations: $acrossReplicateOperations
      subjectColumn: $subjectColumn
      observationDetailColumns: $observationDetailColumns
      coverageMode: $coverageMode
      effortMarkerValues: $effortMarkerValues
      excludedValues: $excludedValues
    }
  ) {
    overlayDataTable {
      ...OverlayDataTableDetails
    }
  }
}

mutation UpdateOverlayDataTableTemporal(
  $overlayDataTableId: Int!
  $temporal: TemporalInfo
) {
  updateOverlayDataTableTemporal(
    overlayDataTableId: $overlayDataTableId
    temporal: $temporal
  ) {
    id
    temporal
  }
}

mutation UpdateOverlayDataTableNodata($tableId: Int!, $nodataValues: JSON!) {
  updateOverlayDataTableNodata(
    input: { tableId: $tableId, nodataValues: $nodataValues }
  ) {
    overlayDataTable {
      ...OverlayDataTableDetails
    }
  }
}

mutation UpdateOverlayDataTableOrganism(
  $overlayDataTableId: Int!
  $organism: OrganismInfo
) {
  updateOverlayDataTableOrganism(
    overlayDataTableId: $overlayDataTableId
    organism: $organism
  ) {
    id
    organism
    organismCatalogUrl
    organismPreviewUrl
    orgQueryUrl
  }
}

mutation CreateOverlayDataTableOrganismReprocess(
  $tableId: Int!
  $organismConfig: JSON!
  $classCsvFilename: String
  $classCsvContentType: String
) {
  createOverlayDataTableOrganismReprocess(
    input: {
      tableId: $tableId
      organismConfig: $organismConfig
      classCsvFilename: $classCsvFilename
      classCsvContentType: $classCsvContentType
    }
  ) {
    overlayDataTableUpload {
      ...OverlayDataTableUploadDetails
    }
    projectBackgroundJob {
      ...JobDetails
    }
  }
}

mutation CreateOverlayDataTableReprocess(
  $tableId: Int!
  $temporalConfig: JSON
  $nodataConfig: JSON
  $clusterOnly: Boolean
) {
  createOverlayDataTableReprocess(
    input: {
      tableId: $tableId
      temporalConfig: $temporalConfig
      nodataConfig: $nodataConfig
      clusterOnly: $clusterOnly
    }
  ) {
    overlayDataTableUpload {
      ...OverlayDataTableUploadDetails
    }
    projectBackgroundJob {
      ...JobDetails
    }
  }
}
