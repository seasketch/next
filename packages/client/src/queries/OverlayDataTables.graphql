# Lean, public-safe subset of OverlayDataTable fields for the map legend /
# table of contents (ActivatedDataTableButton). Deliberately omits internal
# remote paths that only make sense to admins.
fragment ClientOverlayDataTable on OverlayDataTable {
  id
  stableId
  name
  description
  version
  rowCount
  joinColumn
  overlayJoinColumn
  queryUrl
  columnStatsUrl
  visualizationColumns
  visualizationOps
  requiredFilterColumns
  hiddenFilterColumns
  filterColumnLabels
  temporal
}

fragment OverlayDataTableDetails on OverlayDataTable {
  id
  stableId
  name
  description
  version
  joinColumn
  overlayJoinColumn
  rowCount
  parquetRemote
  columnStatsRemote
  parquetUrl
  columnStatsUrl
  queryUrl
  deletedAt
  replacedById
  createdAt
  updatedAt
  visualizationColumns
  visualizationOps
  requiredFilterColumns
  hiddenFilterColumns
  filterColumnLabels
  temporal
  nodataValues
}

query OverlayDataTableVisualizationMetadata($id: Int!) {
  overlayDataTable(id: $id) {
    id
    queryUrl
    columnStatsUrl
    visualizationColumns
    visualizationOps
    requiredFilterColumns
    hiddenFilterColumns
    filterColumnLabels
  }
}

query OverlayDataTableVisualizationMetadataForLayer($tocItemId: Int!) {
  tableOfContentsItem(id: $tocItemId) {
    id
    overlayDataTables {
      id
      queryUrl
      columnStatsUrl
      visualizationColumns
      visualizationOps
      requiredFilterColumns
      hiddenFilterColumns
      filterColumnLabels
    }
  }
}

fragment OverlayDataTableUploadDetails on OverlayDataTableUpload {
  id
  tableOfContentsItemId
  filename
  contentType
  processingOptions
  overlayJoinColumn
  errorDetails
  presignedUploadUrl
  replaceOverlayDataTableId
  reprocessOfOverlayDataTableId
  projectBackgroundJobId
}

mutation CreateOverlayDataTableUpload(
  $tableOfContentsItemId: Int!
  $filename: String!
  $contentType: String!
  $processingOptions: JSON
  $replaceOverlayDataTableId: Int
) {
  createOverlayDataTableUpload(
    input: {
      tocItemId: $tableOfContentsItemId
      filename: $filename
      contentType: $contentType
      processingOptions: $processingOptions
      replaceOverlayDataTableId: $replaceOverlayDataTableId
    }
  ) {
    overlayDataTableUpload {
      ...OverlayDataTableUploadDetails
    }
    projectBackgroundJob {
      ...JobDetails
    }
  }
}

mutation SubmitOverlayDataTableUpload($jobId: UUID!) {
  submitOverlayDataTableUpload(input: { jobId: $jobId }) {
    projectBackgroundJob {
      id
      state
      progress
      progressMessage
    }
  }
}

mutation UpdateOverlayDataTableDetails($id: Int!, $name: String!, $description: String) {
  updateOverlayDataTableDetails(
    input: { tableId: $id, name: $name, description: $description }
  ) {
    overlayDataTable {
      ...OverlayDataTableDetails
    }
  }
}

mutation RenameOverlayDataTable($id: Int!, $name: String!) {
  renameOverlayDataTable(input: { tableId: $id, newName: $name }) {
    overlayDataTable {
      ...OverlayDataTableDetails
    }
  }
}

mutation SoftDeleteOverlayDataTable($id: Int!) {
  softDeleteOverlayDataTable(input: { tableId: $id }) {
    overlayDataTable {
      id
      deletedAt
    }
  }
}

mutation RollbackOverlayDataTableVersion($id: Int!) {
  rollbackOverlayDataTableVersion(input: { tableId: $id }) {
    overlayDataTable {
      ...OverlayDataTableDetails
    }
  }
}

mutation SetOverlayDataTableVisualizationSettings(
  $id: Int!
  $visualizationColumns: [String]!
  $visualizationOps: [String]!
  $requiredFilterColumns: [String]!
  $hiddenFilterColumns: [String]!
  $filterColumnLabels: JSON!
) {
  setOverlayDataTableVisualizationSettings(
    input: {
      tableId: $id
      visualizationColumns: $visualizationColumns
      visualizationOps: $visualizationOps
      requiredFilterColumns: $requiredFilterColumns
      hiddenFilterColumns: $hiddenFilterColumns
      filterColumnLabels: $filterColumnLabels
    }
  ) {
    overlayDataTable {
      ...OverlayDataTableDetails
    }
  }
}

mutation UpdateOverlayDataTableTemporal(
  $overlayDataTableId: Int!
  $temporal: TemporalInfo
) {
  updateOverlayDataTableTemporal(
    overlayDataTableId: $overlayDataTableId
    temporal: $temporal
  ) {
    id
    temporal
  }
}

mutation UpdateOverlayDataTableNodata($tableId: Int!, $nodataValues: JSON!) {
  updateOverlayDataTableNodata(
    input: { tableId: $tableId, nodataValues: $nodataValues }
  ) {
    overlayDataTable {
      ...OverlayDataTableDetails
    }
  }
}

mutation CreateOverlayDataTableReprocess(
  $tableId: Int!
  $temporalConfig: JSON
  $nodataConfig: JSON
) {
  createOverlayDataTableReprocess(
    input: {
      tableId: $tableId
      temporalConfig: $temporalConfig
      nodataConfig: $nodataConfig
    }
  ) {
    overlayDataTableUpload {
      ...OverlayDataTableUploadDetails
    }
    projectBackgroundJob {
      ...JobDetails
    }
  }
}
