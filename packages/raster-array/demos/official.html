<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mapbox-hosted raster-array control</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="map"></div>
    <div class="topbar">
      <div>
        <h1>Mapbox GFS temperature</h1>
        <p>Control: <code>mapbox://mapbox.gfs-temperature</code> to verify GL JS 3.4 + the SeaSketch token.</p>
      </div>
      <nav id="nav"></nav>
    </div>
    <div class="slider">
      <div class="slider-row">
        <button class="icon" id="play" type="button">▶</button>
        <div class="year" id="year" style="min-width: 6ch">—</div>
        <input id="band" type="range" min="0" max="1" value="0" />
      </div>
      <div class="ticks" id="ticks"></div>
      <div class="meta">If this page is blank, the token or raster-array support is the problem — not the encoder.</div>
    </div>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
    <script src="/config.js"></script>
    <script type="module">
      import { nav, createMap, bindSlider, showError } from "./app.js";
      document.getElementById("nav").innerHTML = nav("Mapbox control");

      try {
        const map = await createMap([0, 20], 1, {
          style: "mapbox://styles/mapbox/light-v11",
        });
        map.addSource("gfs-temperature", {
          type: "raster-array",
          url: "mapbox://mapbox.gfs-temperature",
          tileSize: 256,
        });
        map.addLayer({
          id: "gfs-temperature-layer",
          type: "raster",
          source: "gfs-temperature",
          "source-layer": "2t",
          paint: {
            "raster-color-range": [204, 323],
            "raster-array-band": "3",
            "raster-color": [
              "interpolate",
              ["linear"],
              ["raster-value"],
              204, "#50509B",
              266, "#FAFAA0",
              323, "#96053C",
            ],
            "raster-resampling": "nearest",
            "raster-fade-duration": 0,
          },
        });

        const src = map.getSource("gfs-temperature");
        const bandsFromSource = () =>
          src.rasterLayers?.[0]?.fields?.bands ||
          src.raster_layers?.[0]?.fields?.bands;

        const startSlider = (bands) => {
          bindSlider({
            bands,
            playMs: 400,
            onBand: (band) =>
              map.setPaintProperty("gfs-temperature-layer", "raster-array-band", band),
          });
        };

        const immediate = bandsFromSource();
        if (immediate?.length) {
          startSlider(immediate);
        } else {
          map.on("sourcedata", (e) => {
            if (e.sourceId !== "gfs-temperature" || e.sourceDataType !== "metadata") return;
            startSlider(bandsFromSource() || ["0", "3", "6"]);
          });
        }
      } catch (err) {
        showError(err);
      }
    </script>
  </body>
</html>
