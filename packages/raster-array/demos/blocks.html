<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MRT block grouping — raster-array</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="map"></div>
    <div class="topbar">
      <div>
        <h1>Range-addressable blocks</h1>
        <p>Same 12-band raster, two encodings. Watch Network: one fat fetch vs a fetch per year.</p>
      </div>
      <label style="font-size: 13px; color: var(--muted)">
        Encoding
        <select id="mode" style="margin-left: 8px">
          <option value="categories-all">all 12 bands in one block</option>
          <option value="categories-split">1 band per block</option>
        </select>
      </label>
      <nav id="nav"></nav>
    </div>
    <pre class="log card" id="log">Waiting for .mrt Range requests…</pre>
    <div class="slider">
      <div class="slider-row">
        <button class="icon" id="play" type="button">▶</button>
        <div class="year" id="year">—</div>
        <input id="band" type="range" min="0" max="1" value="0" />
      </div>
      <div class="ticks" id="ticks"></div>
      <div class="meta">
        <code>all</code> is the animation-friendly layout: first tile download includes every year.
        Split is better if you only ever show one band.
      </div>
    </div>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
    <script src="/config.js"></script>
    <script type="module">
      import {
        nav,
        createMap,
        loadTileset,
        mangrovePaint,
        bindSlider,
        addRasterArrayLayer,
        showError,
      } from "./app.js";
      document.getElementById("nav").innerHTML = nav("MRT blocks");

      const origFetch = window.fetch.bind(window);
      const lines = [];
      function note(line) {
        lines.unshift(line);
        document.getElementById("log").textContent = lines.slice(0, 40).join("\n");
      }
      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input.url;
        const headers = new Headers(init?.headers || input.headers);
        const range = headers.get("Range") || headers.get("range");
        if (url.includes(".mrt")) {
          note(`${range ? range : "bytes=*"}  ${url.replace(location.origin, "")}`);
        }
        return origFetch(input, init);
      };

      const map = await createMap([-81.3, 25.6], 10);

      async function show(id) {
        const tj = await loadTileset(id);
        const layer = tj.raster_layers[0];
        const bands = layer.fields.bands;
        lines.length = 0;
        note(`source ${id}`);
        await addRasterArrayLayer(map, {
          sourceId: "raster-src",
          layerId: "raster-layer",
          tilesetId: id,
          tilejson: tj,
          paint: mangrovePaint(bands[0]),
        });
        bindSlider({
          bands,
          onBand: (band) => map.setPaintProperty("raster-layer", "raster-array-band", band),
        });
      }

      document.getElementById("mode").addEventListener("change", (e) => {
        show(e.target.value).catch(showError);
      });
      try {
        await show("categories-all");
      } catch (err) {
        showError(err);
      }
    </script>
  </body>
</html>
