<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S-57 chart</title>
    <link href="/vendor/mapbox-gl.css" rel="stylesheet" />
    <style>
      html,
      body,
      #map {
        margin: 0;
        height: 100%;
        background: #d4eaee;
      }
      .bar {
        position: absolute;
        z-index: 2;
        top: 12px;
        left: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: min(720px, calc(100% - 70px));
        padding: 8px;
        background: rgba(244, 241, 228, 0.94);
        border: 1px solid #525a5c;
        font: 13px/1.3 "Segoe UI", sans-serif;
        color: #070707;
      }
      button {
        font: inherit;
        padding: 4px 8px;
        background: #fff;
        border: 1px solid #525a5c;
        cursor: pointer;
      }
      button:hover {
        background: #d4eaee;
      }
      .note {
        align-self: center;
        color: #525a5c;
      }
      button.on {
        background: #d4eaee;
        font-weight: 600;
      }
      #regions,
      #views {
        display: contents;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <strong>S-57</strong>
      <span id="regions"></span>
      <span id="views"></span>
      <span class="note">Not for navigation</span>
    </div>
    <div id="map"></div>
    <script src="/vendor/mapbox-gl.js"></script>
    <script src="/app.js?v=__APP_VERSION__"></script>
  </body>
</html>
